<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="view"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ali real estate</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2a26;--mut:#6b7a74;--ac:#0f6b57;--ac2:#e8f3ef;--bd:#e3e0d8;--dng:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1b2420;--tx:#e8efec;--mut:#93a39c;--ac:#3fbf9f;--ac2:#1f3a32;--bd:#2c3a34;--dng:#f2867f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{padding:16px;max-width:1000px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:1.4rem}
main{max-width:1000px;margin:auto;padding:0 16px 40px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--ac2);color:var(--ac)}
.btn.dng{background:transparent;color:var(--dng);border:1px solid var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:16/10;background:var(--ac2);display:flex;align-items:center;justify-content:center;font-size:2rem}
.ph img{width:100%;height:100%;object-fit:cover}
.bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;background:var(--ac2);color:var(--ac);font-size:.78rem;padding:2px 10px;border-radius:99px}
.price{font-weight:700;color:var(--ac);font-size:1.1rem}
.meta{color:var(--mut);font-size:.88rem;display:flex;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(520px,94vw);padding:18px;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-size:.88rem;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fa{display:flex;gap:8px;margin-top:16px}
html[data-mode="view"] .admin{display:none!important}
</style>
</head>
<body>
<header>
  <h1>🏠 ali real estate</h1>
  <div class="bar admin">
    <button class="btn" id="addBtn">+ إضافة</button>
    <button class="btn sec" id="pubBtn">نشر الموقع</button>
    <button class="btn sec" id="bkBtn">نسخة احتياطية</button>
    <button class="btn sec" id="rsBtn">استرجاع</button>
    <input type="file" id="rsFile" accept=".json" hidden="">
  </div>
</header>
<main>
  <div class="filters" id="filters"><button class="chip on" data-f="الكل">الكل</button><button class="chip" data-f="للبيع">للبيع</button><button class="chip" data-f="للإيجار">للإيجار</button></div>
  <div id="empty" class="empty" style="display:none"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg">
  <h2 id="dtitle" style="margin:0 0 4px;font-size:1.2rem">عقار جديد</h2>
  <label>العنوان</label><input id="f_title">
  <div class="row">
    <div><label>نوع العرض</label><select id="f_deal"><option>للبيع</option><option>للإيجار</option></select></div>
    <div><label>نوع العقار</label><select id="f_kind"><option>شقة</option><option>فيلا</option><option>أرض</option><option>محل تجاري</option><option>مكتب</option><option>أخرى</option></select></div>
  </div>
  <div class="row">
    <div><label>السعر (مع العملة)</label><input id="f_price" placeholder="مثال: 50,000 دولار"></div>
    <div><label>المدينة / الحي</label><input id="f_city"></div>
  </div>
  <div class="row">
    <div><label>المساحة (م²)</label><input id="f_area" type="number" inputmode="numeric"></div>
    <div><label>رقم التواصل / واتساب</label><input id="f_phone" type="tel" inputmode="tel" placeholder="963..."></div>
  </div>
  <div class="row">
    <div><label>الغرف</label><input id="f_beds" type="number" inputmode="numeric"></div>
    <div><label>دورات المياه</label><input id="f_baths" type="number" inputmode="numeric"></div>
  </div>
  <label>الوصف</label><textarea id="f_desc" rows="3"></textarea>
  <label>صورة</label><input id="f_img" type="file" accept="image/*">
  <div class="fa"><button class="btn" id="saveBtn">حفظ</button><button class="btn sec" id="cancelBtn">إلغاء</button></div>
</dialog>

<dialog id="outDlg">
  <h2 style="margin:0 0 4px;font-size:1.1rem">الملف جاهز: <span id="outName" dir="ltr"></span></h2>
  <div style="color:var(--mut);font-size:.9rem">اضغط «حفظ كملف» ثم اختر <b>Save to Files</b> (أو Download). بعدها ارفعه إلى GitHub.</div>
  <details style="margin-top:12px"><summary style="cursor:pointer">خيار بديل: نسخ الكود</summary>
    <textarea id="outTxt" rows="5" dir="ltr" readonly="" style="margin-top:8px"></textarea>
    <button class="btn sec" id="copyBtn" style="margin-top:8px">نسخ الكود</button>
  </details>
  <div class="fa"><button class="btn" id="saveFileBtn">حفظ كملف</button><button class="btn sec" id="outClose">إغلاق</button></div>
</dialog>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var KEY='aqarati_v1', items=[], filter='الكل', editing=null, img=null;
  var embedTxt=$('embed').textContent.trim();
  var viewMode=!!embedTxt;
  if(viewMode){document.documentElement.setAttribute('data-mode','view');try{items=JSON.parse(embedTxt)}catch(e){}}
  else{try{items=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){items=[]}}

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(items));return true}catch(e){alert('الذاكرة ممتلئة. احذف بعض الصور أو العقارات القديمة.');return false}}
  async function download(name,text,type){
    $('outName').textContent=name+' ('+Math.round(text.length/1024)+' KB)';
    $('outTxt').value=text;window._o={name:name,type:type,text:text};
    if(!$('outDlg').open)$('outDlg').showModal();
  }
  function copyOut(){
    var t=$('outTxt');t.focus();t.select();t.setSelectionRange(0,t.value.length);
    var ok=function(){$('copyBtn').textContent='تم النسخ ✓'};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand('copy');ok()});return}}catch(e){}
    try{document.execCommand('copy');ok()}catch(e){}
  }

  function renderFilters(){
    $('filters').innerHTML=['الكل','للبيع','للإيجار'].map(function(o){return '<button class="chip'+(o===filter?' on':'')+'" data-f="'+o+'">'+o+'</button>'}).join('');
    Array.prototype.forEach.call($('filters').children,function(b){b.onclick=function(){filter=b.dataset.f;renderFilters();render()}});
  }
  function text(x){
    return ['🏠 '+x.title,x.deal+' - '+x.kind,x.price&&'💰 '+x.price,x.city&&'📍 '+x.city,x.area&&'📐 '+x.area+' م²',x.beds&&'🛏 غرف: '+x.beds,x.baths&&'🚿 حمامات: '+x.baths,x.desc,x.phone&&'📞 '+x.phone].filter(Boolean).join('\n');
  }
  function render(){
    var list=items.filter(function(x){return filter==='الكل'||x.deal===filter});
    var e=$('empty');
    if(!list.length){$('grid').innerHTML='';e.style.display='block';e.textContent=items.length?'لا توجد عقارات في هذا التصنيف.':(viewMode?'لا توجد عقارات حالياً.':'لم تضف أي عقار بعد. اضغط «+ إضافة».');return}
    e.style.display='none';
    $('grid').innerHTML=list.map(function(x){
      var meta=[];
      if(x.city)meta.push('📍 '+esc(x.city));
      if(x.area)meta.push('📐 '+esc(x.area)+' م²');
      if(x.beds)meta.push('🛏 '+esc(x.beds));
      if(x.baths)meta.push('🚿 '+esc(x.baths));
      var wa=x.phone?'<a class="btn" href="https://wa.me/'+esc(String(x.phone).replace(/\D/g,''))+'">واتساب</a><a class="btn sec" href="tel:'+esc(x.phone)+'">اتصال</a>':'';
      return '<div class="card"><div class="ph">'+(x.img?'<img src="'+x.img+'" alt="">':'🏠')+'</div><div class="bd"><span class="tag">'+esc(x.deal)+' · '+esc(x.kind)+'</span>'
       +'<b>'+esc(x.title)+'</b><div class="price">'+(esc(x.price)||'السعر عند التواصل')+'</div><div class="meta">'+meta.join('')+'</div>'
       +(x.desc?'<div>'+esc(x.desc)+'</div>':'')
       +'<div class="acts">'+wa+'<button class="btn sec" data-s="'+x.id+'">مشاركة</button>'
       +'<span class="admin"><button class="btn sec" data-e="'+x.id+'">تعديل</button> <button class="btn dng" data-d="'+x.id+'">حذف</button></span></div></div></div>';
    }).join('');
    var q=function(a,f){Array.prototype.forEach.call($('grid').querySelectorAll('['+a+']'),function(b){b.onclick=function(){f(b.getAttribute(a))}})};
    q('data-s',share);q('data-e',openForm);q('data-d',del);
  }
  function find(id){return items.filter(function(i){return i.id===id})[0]}
  async function share(id){
    var x=find(id);if(!x)return;var t=text(x);
    try{
      if(navigator.share){
        var d={text:t};
        if(x.img&&navigator.canShare){var b=await (await fetch(x.img)).blob();var f=new File([b],'aqar.jpg',{type:'image/jpeg'});if(navigator.canShare({files:[f]}))d.files=[f]}
        await navigator.share(d);return;
      }
    }catch(e){if(e&&e.name==='AbortError')return}
    window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');
  }
  var F=['title','deal','kind','price','city','area','phone','beds','baths','desc'];
  function openForm(id){
    editing=id||null;var x=(id&&find(id))||{};img=x.img||null;$('f_img').value='';
    F.forEach(function(k){$('f_'+k).value=x[k]==null?'':x[k]});
    if(!x.deal)$('f_deal').selectedIndex=0;if(!x.kind)$('f_kind').selectedIndex=0;
    $('dtitle').textContent=id?'تعديل العقار':'عقار جديد';$('dlg').showModal();
  }
  function shrink(file){return new Promise(function(res,rej){
    var r=new FileReader();r.onerror=rej;r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.65))};im.src=r.result};r.readAsDataURL(file)})}
  async function save(){
    var t=$('f_title').value.trim();if(!t){$('f_title').focus();return}
    var f=$('f_img').files[0];
    if(f){try{img=await shrink(f)}catch(e){alert('تعذّر قراءة الصورة')}}
    var o=editing?find(editing):{id:'i'+Date.now(),createdAt:Date.now()};
    F.forEach(function(k){o[k]=$('f_'+k).value.trim()});o.img=img;
    var backup=JSON.stringify(items);
    if(!editing)items.unshift(o);
    if(!persist()){items=JSON.parse(backup);return}
    $('dlg').close();render();
  }
  function del(id){if(!confirm('حذف هذا العقار نهائياً؟'))return;items=items.filter(function(i){return i.id!==id});persist();render()}

  $('addBtn').onclick=function(){openForm(null)};
  $('saveBtn').onclick=save;$('cancelBtn').onclick=function(){$('dlg').close()};
  $('bkBtn').onclick=function(){download('aqarati-backup.json',JSON.stringify(items),'application/json')};
  $('rsBtn').onclick=function(){$('rsFile').click()};
  $('rsFile').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){
    try{var d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;if(!confirm('سيتم استبدال العقارات الحالية. متابعة؟'))return;items=d;persist();render()}catch(e){alert('ملف غير صالح')}};r.readAsText(f)};
  $('pubBtn').onclick=function(){
   try{
    var clone=document.documentElement.cloneNode(true);
    clone.querySelector('#outTxt').value='';clone.querySelector('#outTxt').textContent='';
    clone.querySelector('#outDlg').removeAttribute('open');
    clone.querySelector('#embed').textContent=JSON.stringify(items).replace(/</g,'\\u003c');
    clone.setAttribute('data-mode','view');
    clone.querySelector('#grid').innerHTML='';
    download('index.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html');
   }catch(e){alert('خطأ: '+(e&&e.message||e))}
  };
  $('copyBtn').onclick=copyOut;
  $('saveFileBtn').onclick=async function(){
    var o=window._o;if(!o)return;
    var f=new File([o.text],o.name,{type:o.type});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
    var a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=o.name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},800);
  };
  $('outClose').onclick=function(){$('copyBtn').textContent='نسخ';$('outDlg').close()};
  renderFilters();render();
})();
</script>
